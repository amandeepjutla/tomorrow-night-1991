# Tomorrow Night 1991 for Midnight Commander
#
# Author: Claude Opus 5
# Created: 2026-09-21, at the request of Amandeep Jutla.
# https://github.com/amandeepjutla/tomorrow-night-1991
#
# Derived from the julia256 skin: every key and its role is kept, with each
# named color replaced by its Tomorrow Night 1991 counterpart in truecolor.
#

[skin]
    description = Tomorrow Night 1991
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ┌
    drighttop = ┐
    dleftbottom = └
    drightbottom = ┘
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[core]
    _default_ = #b4b7b4;#373b41
    selected = #1d1f21;#66cccc
    marked = #ffcc66;#373b41
    markselect = #ffcc66;#66cccc
    gauge = #cccccc;#373b41
    input = #1d1f21;#66cccc
    inputunchanged = #999999;#66cccc
    inputmark = #66cccc;#373b41
    disabled = #999999;#b4b7b4
    reverse = #1d1f21;#b4b7b4
    commandlinemark = #1d1f21;#b4b7b4
    header = #ffcc66;#373b41
    inputhistory =
    commandhistory =
    shadow = #999999;#1d1f21

[dialog]
    _default_ = #1d1f21;#b4b7b4
    dfocus = #1d1f21;#66cccc
    dhotnormal = #f2777a;
    dhotfocus = #f2777a;#66cccc
    dtitle = #1d1f21;

[error]
    _default_ = #cccccc;#f2777a
    errdfocus = #1d1f21;#b4b7b4
    errdhotnormal = #ffcc66;#f2777a
    errdhotfocus = #f2777a;#b4b7b4
    errdtitle = #ffcc66;#f2777a

[filehighlight]
    directory = #cccccc;
    executable = #dfc7e0;
    symlink = #b4b7b4;
    hardlink =
    stalelink = #f2b2ae;
    device = #dfc7e0;
    special = #a6c2e0;
    core = #f2777a;
    temp = #999999;
    archive = #cae1c5;
    doc = brown;
    source = #66cccc;
    media = #99cc99;
    graph = #a9dee1;
    database = #f2b2ae;

[menu]
    _default_ = #b4b7b4;#6699cc
    menusel = #1d1f21;#66cccc
    menuhot = #cccccc;#6699cc
    menuhotsel = #cccccc;#66cccc
    menuinactive = #1d1f21;#b4b7b4

[popupmenu]
    _default_ = #b4b7b4;#6699cc
    menusel = #1d1f21;#66cccc
    menutitle = #ffcc66;#6699cc

[buttonbar]
    hotkey = #f2777a;#b4b7b4
    button = #1d1f21;#b4b7b4

[statusbar]
    _default_ = #1d1f21;#b4b7b4

[help]
    _default_ = #1d1f21;#b4b7b4
    helpitalic = #f2777a;#b4b7b4
    helpbold = #6699cc;#b4b7b4
    helplink = #1d1f21;#66cccc
    helpslink = #ffcc66;#6699cc
    helptitle = #6699cc;#b4b7b4

[editor]
    _default_ = #b4b7b4;#1d1f21
    editbold = #ffcc66;#99cc99
    editmarked = #1d1f21;#b4b7b4
    editwhitespace = #a6c2e0;#1d1f21
    editnonprintable = ;#1d1f21
    editlinestate = #cccccc;#66cccc
    bookmark = #cccccc;#f2777a
    bookmarkfound = #1d1f21;#99cc99
    editrightmargin = #b4b7b4;#373b41
#    editbg =
    editframe = #999999;
    editframeactive = #b4b7b4;
    editframedrag = #f2777a;
    window-state-char = ↕
    window-close-char = ✕

[viewer]
    _default_ = #b4b7b4;#1d1f21
    viewbold = #ffcc66;#1d1f21
    viewunderline = #f2b2ae;#1d1f21
    viewselected = #ffcc66;#66cccc

[diffviewer]
    added = #cccccc;#99cc99
    changedline = #1d1f21;#66cccc
    changednew = #f2777a;#66cccc
    changed = #cccccc;#66cccc
    removed = #cccccc;#f2777a
    error = #f2777a;#b4b7b4

[widget-panel]
    sort-up-char = ↑
    sort-down-char = ↓
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ←
    history-next-item-char = →
    history-show-list-char = ↓
    filename-scroll-left-char = «
    filename-scroll-right-char = »

[widget-scrollbar]
    first-vert-char = ↑
    last-vert-char = ↓
    first-horiz-char = «
    last-horiz-char = »
    current-char = ■
    background-char = ▒
